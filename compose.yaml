services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: opencomm
      POSTGRES_USER: opencomm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencomm -d opencomm"]
      interval: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://opencomm:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/opencomm
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  ingest:
    build: .
    profiles: ["ingest"]
    command: ["python", "-m", "services.ingest.cli"]
    environment:
      DATABASE_URL: postgresql://opencomm:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/opencomm
      SOURCE_COUNTRY_MCC: ${SOURCE_COUNTRY_MCC:-425}
    volumes: ["./data:/data"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
